name: Feature request
description: Suggest something ASMS should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: >
        Describe the situation rather than the solution. "I run four maps in a cluster and
        can never remember which one has the mod that breaks" is more useful than "add a
        column to the table".
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What did you have in mind?
      description: Optional — a rough shape is fine.

  - type: textarea
    id: today
    attributes:
      label: How do you handle it today?
      description: Another tool, a spreadsheet, a Discord thread, giving up.
